<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>LLM Chat App</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--primary: #FFD700;
				--secondary: #FF6B9D;
				--accent: #A3E635;
				--info: #7DD3FC;
				--border-width: 2px;
				--shadow-offset: 4px;
				--radius-lg: 12px;
				--radius-md: 8px;
			}

			[data-theme="light"] {
				--bg-body: #FFFEF5;
				--bg-container: #FFFFFF;
				--bg-chat: #FEFCE8;
				--bg-input-area: #FFFFFF;
				--bg-input: #FFFFFF;
				--border-color: #000000;
				--shadow-color: #000000;
				--text-color: #1a1a1a;
				--text-light: #555555;
				--user-msg-bg: #FFF3CD;
				--assistant-msg-bg: #DBEAFE;
				--header-bg: #FFD700;
				--btn-bg: #FFD700;
				--btn-text: #000000;
				--toggle-bg: #FF6B9D;
				--toggle-text: #000000;
				--typing-color: #555555;
			}

			[data-theme="dark"] {
				--bg-body: #0e1016;
				--bg-container: #1a1d27;
				--bg-chat: #14161e;
				--bg-input-area: #1a1d27;
				--bg-input: #232733;
				--border-color: #3a4051;
				--shadow-color: rgba(125, 211, 252, 0.18);
				--text-color: #eceef3;
				--text-light: #99a0ad;
				--user-msg-bg: #3b3214;
				--assistant-msg-bg: #1d2c44;
				--header-bg: #f5cb1f;
				--btn-bg: #f5cb1f;
				--btn-text: #1a1a1a;
				--toggle-bg: #a3e635;
				--toggle-text: #1a1a1a;
				--typing-color: #99a0ad;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family:
					"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
					sans-serif;
				line-height: 1.6;
				color: var(--text-color);
				background-color: var(--bg-body);
				max-width: 800px;
				margin: 0 auto;
				padding: 1rem;
				min-height: 100vh;
				min-height: 100dvh;
				display: flex;
				flex-direction: column;
				transition: background-color 0.3s ease, color 0.3s ease;
			}

			header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				margin-bottom: 1.5rem;
				padding: 1rem 1.5rem;
				background-color: var(--header-bg);
				border: var(--border-width) solid var(--border-color);
				border-radius: var(--radius-lg);
				box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--shadow-color);
				transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
			}

			.header-text {
				display: flex;
				flex-direction: column;
			}

			h1 {
				font-family: "Space Grotesk", "Inter", sans-serif;
				font-size: 1.6rem;
				font-weight: 700;
				color: #000000;
				letter-spacing: -0.5px;
			}

			header p {
				font-size: 0.85rem;
				font-weight: 600;
				color: #333333;
			}

			#theme-toggle {
				padding: 0.5rem 1rem;
				background-color: var(--toggle-bg);
				color: var(--toggle-text);
				border: var(--border-width) solid var(--border-color);
				border-radius: var(--radius-md);
				box-shadow: 3px 3px 0px var(--shadow-color);
				font-weight: 700;
				font-size: 1.1rem;
				cursor: pointer;
				transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.3s ease;
				user-select: none;
			}

			#theme-toggle:hover {
				transform: translate(2px, 2px);
				box-shadow: 1px 1px 0px var(--shadow-color);
			}

			#theme-toggle:active {
				transform: translate(3px, 3px);
				box-shadow: 0px 0px 0px var(--shadow-color);
			}

			.chat-container {
				display: flex;
				flex-direction: column;
				flex: 1;
				min-height: 0;
				border: var(--border-width) solid var(--border-color);
				border-radius: var(--radius-lg);
				box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--shadow-color);
				overflow: hidden;
				background-color: var(--bg-container);
				transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
			}

			.chat-messages {
				flex: 1;
				overflow-y: auto;
				padding: 1.25rem;
				background-color: var(--bg-chat);
				transition: background-color 0.3s ease;
			}

			.message {
				margin-bottom: 1rem;
				padding: 0.85rem 1rem;
				border-radius: var(--radius-md);
				max-width: 80%;
				border: var(--border-width) solid var(--border-color);
				box-shadow: 3px 3px 0px var(--shadow-color);
				transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
			}

			.message p {
				white-space: pre-line;
				margin: 0;
				overflow-wrap: anywhere;
				font-weight: 500;
			}

			.user-message {
				background-color: var(--user-msg-bg);
				margin-left: auto;
			}

			.assistant-message {
				background-color: var(--assistant-msg-bg);
				align-self: flex-start;
			}

			.message-input {
				display: flex;
				padding: 0.85rem;
				border-top: var(--border-width) solid var(--border-color);
				background-color: var(--bg-input-area);
				gap: 0.6rem;
				transition: background-color 0.3s ease, border-color 0.3s ease;
			}

			#user-input {
				flex: 1;
				padding: 0.75rem 1rem;
				border: var(--border-width) solid var(--border-color);
				border-radius: var(--radius-md);
				font-family: inherit;
				font-size: 0.95rem;
				font-weight: 500;
				resize: none;
				min-height: 44px;
				background-color: var(--bg-input);
				color: var(--text-color);
				box-shadow: 2px 2px 0px var(--shadow-color);
				transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, color 0.3s ease;
				outline: none;
			}

			#user-input:focus {
				box-shadow: 3px 3px 0px var(--shadow-color);
			}

			#user-input::placeholder {
				color: var(--text-light);
			}

			#send-button {
				padding: 0.6rem 1.4rem;
				background-color: var(--btn-bg);
				color: var(--btn-text);
				border: var(--border-width) solid var(--border-color);
				border-radius: var(--radius-md);
				box-shadow: 3px 3px 0px var(--shadow-color);
				cursor: pointer;
				font-family: "Space Grotesk", "Inter", sans-serif;
				font-weight: 700;
				font-size: 0.95rem;
				letter-spacing: 0.3px;
				transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.3s ease;
			}

			#send-button:hover {
				transform: translate(2px, 2px);
				box-shadow: 1px 1px 0px var(--shadow-color);
			}

			#send-button:active {
				transform: translate(3px, 3px);
				box-shadow: 0px 0px 0px var(--shadow-color);
			}

			#send-button:disabled {
				background-color: var(--text-light);
				cursor: not-allowed;
				transform: none;
				box-shadow: 3px 3px 0px var(--shadow-color);
				opacity: 0.6;
			}

			.typing-indicator {
				display: none;
				font-style: italic;
				font-weight: 600;
				color: var(--typing-color);
				padding: 0.75rem 1.25rem;
				border-top: var(--border-width) solid var(--border-color);
				background-color: var(--bg-input-area);
				transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
			}

			.typing-indicator.visible {
				display: block;
			}
		</style>
	</head>
	<body>
		<header>
			<div class="header-text">
				<h1>Cloudflare AI Chat</h1>
				<p>Powered by Cloudflare Workers AI</p>
			</div>
			<button id="theme-toggle" aria-label="Toggle theme">&#9728;</button>
		</header>

		<div class="chat-container">
			<div id="chat-messages" class="chat-messages">
				<div class="message assistant-message">
					<p>
						Hello! I'm an LLM chat app powered by Cloudflare Workers AI. How can
						I help you today?
					</p>
				</div>
			</div>

			<div class="typing-indicator" id="typing-indicator">
				AI is thinking...
			</div>

			<div class="message-input">
				<textarea
					id="user-input"
					placeholder="Type your message here..."
					rows="1"
					autofocus
				></textarea>
				<button id="send-button">Send</button>
			</div>
		</div>

		<!-- Chat app script -->
		<script src="chat.js"></script>
	</body>
</html>
